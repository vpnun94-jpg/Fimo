<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Predictive Quantum Pro Max Calculator</title>
    <meta name="theme-color" content="#010308">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pred: {
                            bg: '#010308',
                            cyan: '#00f2ff',
                            magenta: '#ff007f',
                            purple: '#9d00ff',
                            emerald: '#00ffaa',
                            hud: '#050a18'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #010308;
        }

        /* AI Predictive Holographic Aurora & Energy Field */
        .holographic-field {
            position: absolute;
            inset: -50%;
            background: radial-gradient(circle at 20% 20%, rgba(0, 242, 255, 0.2) 0%, transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(255, 0, 127, 0.16) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(157, 0, 255, 0.14) 0%, transparent 50%);
            animation: holoFlow 12s infinite alternate ease-in-out;
            z-index: 0;
            pointer-events: none;
            filter: blur(55px);
        }

        @keyframes holoFlow {
            0% { transform: scale(1) translate(0, 0) rotate(0deg); }
            50% { transform: scale(1.12) translate(-3%, 4%) rotate(3deg); }
            100% { transform: scale(1) translate(3%, -3%) rotate(-3deg); }
        }

        /* Liquid Metal & Morphing Glass Panels */
        .glass-hud {
            background: rgba(5, 10, 24, 0.84);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(0, 242, 255, 0.28);
            box-shadow: 0 0 70px rgba(0, 0, 0, 0.98), inset 0 0 35px rgba(0, 242, 255, 0.08);
        }

        .light .glass-hud {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(0, 0, 0, 0.12);
        }

        /* 3D Holographic Display Projection & Energy Ring Border */
        @keyframes energyPulse {
            0% { border-color: rgba(0, 242, 255, 0.45); box-shadow: 0 0 30px rgba(0,242,255,0.2); }
            50% { border-color: rgba(255, 0, 127, 0.7); box-shadow: 0 0 50px rgba(255,0,127,0.35); }
            100% { border-color: rgba(0, 242, 255, 0.45); box-shadow: 0 0 30px rgba(0,242,255,0.2); }
        }

        .hud-border {
            animation: energyPulse 4s infinite ease-in-out;
        }

        /* Liquid Metal Buttons with Spring Physics */
        .btn-predictive {
            border-radius: 14px;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease, background 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(15px);
        }

        .btn-predictive:active, .btn-predictive.btn-pressed {
            transform: scale(0.85) translateY(2px);
        }

        .btn-num:active, .btn-num.btn-pressed {
            box-shadow: 0 0 35px rgba(0, 242, 255, 0.9), inset 0 0 15px rgba(0, 242, 255, 0.5);
            border-color: #00f2ff;
            background: rgba(0, 242, 255, 0.25) !important;
        }

        .btn-action:active, .btn-action.btn-pressed {
            box-shadow: 0 0 40px rgba(157, 0, 255, 0.95), inset 0 0 16px rgba(157, 0, 255, 0.6);
            border-color: #9d00ff;
            background: rgba(157, 0, 255, 0.35) !important;
            color: #fff !important;
        }

        .btn-danger:active, .btn-danger.btn-pressed {
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.95), inset 0 0 16px rgba(255, 0, 127, 0.6);
            border-color: #ff007f;
            background: rgba(255, 0, 127, 0.35) !important;
        }

        /* Touch-Reactive Energy Ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: predictiveRipple 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            background: radial-gradient(circle, rgba(0,242,255,0.95) 0%, rgba(255,0,127,0.6) 45%, transparent 85%);
            pointer-events: none;
        }

        @keyframes predictiveRipple {
            to { transform: scale(5.5); opacity: 0; }
        }

        #particle-canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 242, 255, 0.4); border-radius: 8px; }

        .result-animate {
            animation: springUp 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes springUp {
            0% { transform: translateY(6px) scale(0.96); opacity: 0.5; filter: blur(3px); }
            100% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
        }
    </style>
</head>
<body class="flex justify-center items-center relative overflow-hidden">

    <!-- Holographic Background Simulation -->
    <div class="holographic-field"></div>

    <!-- Quantum Particle Field Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- App Container -->
    <div class="relative w-full h-full glass-hud hud-border flex flex-col justify-end p-2.5 overflow-hidden text-white light:text-gray-900 transition-colors duration-300 z-20">
        
        <!-- Top HUD Controls Bar -->
        <div class="absolute top-2.5 inset-x-2.5 flex justify-between items-center z-25 px-1">
            <button id="toggle-history" class="p-1.5 rounded-xl bg-white/5 hover:bg-white/15 active:scale-95 transition text-pred-cyan border border-pred-cyan/20">
                <i data-lucide="clock" class="w-4 h-4"></i>
            </button>

            <!-- Voice Waveform HUD Indicator & Settings -->
            <div class="flex items-center gap-1.5">
                <div class="hidden sm:flex items-center gap-1 px-2 py-1 rounded-lg bg-pred-cyan/10 border border-pred-cyan/20">
                    <span class="w-1.5 h-3 bg-pred-cyan animate-pulse rounded-full"></span>
                    <span class="w-1.5 h-5 bg-pred-magenta animate-pulse rounded-full"></span>
                    <span class="w-1.5 h-2 bg-pred-purple animate-pulse rounded-full"></span>
                </div>
                <button id="toggle-scientific" class="px-2.5 py-1 rounded-xl bg-white/5 hover:bg-white/15 text-xs font-semibold text-pred-cyan border border-pred-cyan/30 active:scale-95 transition">
                    SCI
                </button>
                <button id="toggle-theme" class="p-1.5 rounded-xl bg-white/5 hover:bg-white/15 active:scale-95 transition text-pred-cyan border border-pred-cyan/20">
                    <i data-lucide="sun" class="w-4 h-4 hidden light:block"></i>
                    <i data-lucide="moon" class="w-4 h-4 block light:hidden"></i>
                </button>
            </div>
        </div>

        <!-- History Drawer Timeline -->
        <div id="history-drawer" class="absolute inset-x-0 top-0 h-[65%] glass-hud rounded-b-3xl z-40 transform -translate-y-full transition-transform duration-300 ease-in-out p-4 flex flex-col justify-between shadow-2xl border-b border-pred-cyan/30">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <span class="font-bold text-xs text-pred-cyan flex items-center gap-1.5">
                    <i data-lucide="history" class="w-3.5 h-3.5"></i> سجل الحسابات التنبؤي الذكي
                </span>
                <button id="clear-history" class="text-xs text-pred-magenta hover:text-pink-300 flex items-center gap-1">
                    <i data-lucide="trash-2" class="w-3 h-3"></i> مسح
                </button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto my-2 space-y-2 text-left dir-ltr text-sm">
                <div class="text-center text-gray-500 py-8">لا يوجد سجل</div>
            </div>
            <button id="close-history" class="w-full py-2 rounded-xl bg-pred-cyan/25 text-pred-cyan text-xs font-semibold border border-pred-cyan/30">إغلاق</button>
        </div>

        <!-- Display Area -->
        <div class="flex flex-col justify-end text-left px-2 py-3 mb-2 dir-ltr overflow-hidden relative cursor-pointer" id="display-container">
            <div id="expression" class="text-pred-cyan/70 text-xs font-mono h-4 overflow-x-auto whitespace-nowrap scrollbar-none"></div>
            <div id="display" class="text-4xl font-light tracking-tight text-white light:text-gray-900 truncate font-mono drop-shadow-[0_0_20px_rgba(0,242,255,0.7)]">
                0
            </div>
        </div>

        <!-- Keypad Layout -->
        <div class="flex flex-col gap-1.5 pb-1">
            <!-- Scientific Panel -->
            <div id="scientific-panel" class="grid grid-cols-5 gap-1 hidden dir-ltr">
                <button class="btn-predictive btn-action py-1.5 text-[11px] text-pred-cyan" data-op="sin">sin</button>
                <button class="btn-predictive btn-action py-1.5 text-[11px] text-pred-cyan" data-op="cos">cos</button>
                <button class="btn-predictive btn-action py-1.5 text-[11px] text-pred-cyan" data-op="tan">tan</button>
                <button class="btn-predictive btn-action py-1.5 text-[11px] text-pred-cyan" data-op="log">log</button>
                <button class="btn-predictive btn-action py-1.5 text-[11px] text-pred-cyan" data-op="ln">ln</button>
                <button class="btn-predictive btn-num py-1.5 text-[11px] text-gray-300" data-op="sqrt">√</button>
                <button class="btn-predictive btn-num py-1.5 text-[11px] text-gray-300" data-op="pow">x²</button>
                <button class="btn-predictive btn-num py-1.5 text-[11px] text-gray-300" data-op="pi">π</button>
                <button class="btn-predictive btn-num py-1.5 text-[11px] text-gray-300" data-op="e">e</button>
                <button class="btn-predictive btn-num py-1.5 text-[11px] text-gray-300" data-op="fact">n!</button>
            </div>

            <!-- Memory Row -->
            <div class="grid grid-cols-4 gap-1 dir-ltr">
                <button class="btn-predictive py-1 text-[11px] text-gray-400 btn-num" data-mem="mc">MC</button>
                <button class="btn-predictive py-1 text-[11px] text-gray-400 btn-num" data-mem="mr">MR</button>
                <button class="btn-predictive py-1 text-[11px] text-gray-400 btn-num" data-mem="m+">M+</button>
                <button class="btn-predictive py-1 text-[11px] text-gray-400 btn-num" data-mem="m-">M-</button>
            </div>

            <!-- Main Keypad Grid -->
            <div class="grid grid-cols-4 gap-1.5 dir-ltr">
                <!-- Row 1 -->
                <button class="btn-predictive btn-danger h-11 text-pred-magenta font-semibold text-base" id="btn-clear">C</button>
                <button class="btn-predictive btn-action h-11 text-pred-cyan font-semibold text-base" data-action="(">(</button>
                <button class="btn-predictive btn-action h-11 text-pred-cyan font-semibold text-base" data-action=")">)</button>
                <button class="btn-predictive btn-action h-11 text-pred-cyan font-semibold text-lg" data-action="÷">÷</button>

                <!-- Row 2 -->
                <button class="btn-predictive btn-num h-11 text-white light:text-gray-800 text-lg font-medium" data-num="7">7</button>
                <button class="btn-predictive btn-num h-11 text-white light:text-gray-800 text-lg font-medium" data-num="8">8</button>
                <button class="btn-predictive btn-num h-11 text-white light:text-gray-800 text-lg font-medium" data-num="9">9</button>
                <button class="btn-predictive btn-action h-11 text-pred-cyan font-semibold text-lg" data-action="×">×</button>

                <!-- Row 3 -->
                <button class="btn-predictive btn-num h-11 text-white light:text-gray-800 text-lg font-medium" data-num="4">4</button>
                <button class="btn-predictive btn-num h-11 text-white light:text-gray-800 text-lg font-medium" data-num="5">5</button>
                <button class="btn-predictive btn-num h-11 text-white light:text-gray-800 text-lg font-medium" data-num="6">6</button>
                <button class="btn-predictive btn-action h-11 text-pred-cyan font-semibold text-lg" data-action="-">-</button>

                <!-- Row 4 -->
                <button class="btn-predictive btn-num h-11 text-white light:text-gray-800 text-lg font-medium" data-num="1">1</button>
                <button class="btn-predictive btn-num h-11 text-white light:text-gray-800 text-lg font-medium" data-num="2">2</button>
                <button class="btn-predictive btn-num h-11 text-white light:text-gray-800 text-lg font-medium" data-num="3">3</button>
                <button class="btn-predictive btn-action h-11 text-pred-cyan font-semibold text-lg" data-action="+">+</button>

                <!-- Row 5 -->
                <button class="btn-predictive btn-num h-11 text-white light:text-gray-800 text-lg font-medium" data-num="0">0</button>
                <button class="btn-predictive btn-num h-11 text-white light:text-gray-800 text-lg font-medium" data-num=".">.</button>
                <button class="btn-predictive btn-danger h-11 text-gray-300 flex items-center justify-center" id="btn-backspace">
                    <i data-lucide="delete" class="w-4 h-4"></i>
                </button>
                <button class="btn-predictive btn-equals btn-action h-11 bg-gradient-to-r from-pred-cyan via-pred-purple to-pred-magenta text-white font-bold text-xl shadow-[0_0_20px_rgba(0,242,255,0.4)]" id="btn-equals">=</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        lucide.createIcons();

        // Canvas Particle Field Engine
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class PredictiveParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3.5 + 0.8;
                this.speedX = (Math.random() - 0.5) * 3.5;
                this.speedY = (Math.random() - 0.5) * 3.5;
                this.color = Math.random() > 0.5 ? '#00f2ff' : '#ff007f';
                this.life = 1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= 0.025;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 14;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createParticleBurst(x, y) {
            for (let i = 0; i < 12; i++) {
                particles.push(new PredictiveParticle(x, y));
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(index, 1);
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        let fullExpression = '';
        let currentInput = '0';
        let memoryValue = 0;
        let history = JSON.parse(localStorage.getItem('calc_history') || '[]');
        let isScientificOpen = false;

        const display = document.getElementById('display');
        const expression = document.getElementById('expression');
        const historyDrawer = document.getElementById('history-drawer');
        const historyList = document.getElementById('history-list');
        const scientificPanel = document.getElementById('scientific-panel');

        function triggerHaptic() {
            if ('vibrate' in navigator) navigator.vibrate(20);
        }

        document.querySelectorAll('.btn-predictive').forEach(button => {
            button.addEventListener('pointerdown', function (e) {
                triggerHaptic();
                const rect = button.getBoundingClientRect();
                createParticleBurst(e.clientX, e.clientY);

                const circle = document.createElement('span');
                const diameter = Math.max(button.clientWidth, button.clientHeight);
                const radius = diameter / 2;
                
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${e.clientX - rect.left - radius}px`;
                circle.style.top = `${e.clientY - rect.top - radius}px`;
                circle.classList.add('ripple');
                
                const existingRipple = button.getElementsByClassName('ripple')[0];
                if (existingRipple) existingRipple.remove();
                
                button.appendChild(circle);
            });
        });

        function updateDisplay() {
            display.innerText = currentInput;
            expression.innerText = fullExpression;
        }

        function handleInput(val) {
            if (currentInput === '0' && val !== '.' && !['+', '-', '×', '÷', '(', ')'].includes(val.trim())) {
                currentInput = val;
            } else {
                currentInput += val;
            }
            updateDisplay();
        }

        function calculate() {
            try {
                let expressionStr = currentInput
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/π/g, Math.PI)
                    .replace(/e/g, Math.E);

                let result = eval(expressionStr);
                result = Math.round(result * 1e8) / 1e8;

                saveHistory(currentInput, result);

                fullExpression = currentInput + ' =';
                currentInput = result.toString();

                display.classList.add('result-animate');
                setTimeout(() => display.classList.remove('result-animate'), 200);

                updateDisplay();
            } catch (err) {
                currentInput = 'Error';
                updateDisplay();
            }
        }

        function handleScientific(op) {
            let val = parseFloat(currentInput);
            let res = 0;
            switch(op) {
                case 'sin': res = Math.sin(val); break;
                case 'cos': res = Math.cos(val); break;
                case 'tan': res = Math.tan(val); break;
                case 'log': res = Math.log10(val); break;
                case 'ln': res = Math.log(val); break;
                case 'sqrt': res = Math.sqrt(val); break;
                case 'pow': res = Math.pow(val, 2); break;
                case 'pi': currentInput = Math.PI.toString(); updateDisplay(); return;
                case 'e': currentInput = Math.E.toString(); updateDisplay(); return;
            }
            currentInput = (Math.round(res * 1e8) / 1e8).toString();
            updateDisplay();
        }

        function handleBackspace() {
            if (currentInput.length > 1) {
                currentInput = currentInput.trim();
                currentInput = currentInput.slice(0, -1).trim();
                if (currentInput === '') currentInput = '0';
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function saveHistory(expr, res) {
            history.unshift({ expr, res });
            if (history.length > 20) history.pop();
            localStorage.setItem('calc_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = `<div class="text-center text-gray-500 py-8">لا يوجد سجل</div>`;
                return;
            }
            historyList.innerHTML = history.map(item => `
                <div class="p-2.5 bg-white/5 hover:bg-white/10 rounded-xl cursor-pointer transition border border-pred-cyan/10" onclick="useHistory('${item.res}')">
                    <div class="text-[11px] text-gray-400">${item.expr}</div>
                    <div class="text-sm font-bold text-pred-cyan font-mono">= ${item.res}</div>
                </div>
            `).join('');
        }

        window.useHistory = function(res) {
            currentInput = res.toString();
            updateDisplay();
            historyDrawer.classList.add('-translate-y-full');
        };

        // Events
        document.querySelectorAll('.btn-num[data-num]').forEach(b => b.addEventListener('click', () => handleInput(b.dataset.num)));
        document.querySelectorAll('.btn-action[data-action]').forEach(b => b.addEventListener('click', () => {
            let act = b.dataset.action;
            if(['+', '-', '×', '÷', '(', ')'].includes(act)) {
                handleInput(` ${act} `);
            }
        }));
        
        document.querySelectorAll('.btn-predictive[data-op]').forEach(b => b.addEventListener('click', () => handleScientific(b.dataset.op)));

        document.getElementById('btn-equals').addEventListener('click', calculate);
        document.getElementById('btn-clear').addEventListener('click', () => {
            currentInput = '0';
            fullExpression = '';
            updateDisplay();
        });
        document.getElementById('btn-backspace').addEventListener('click', handleBackspace);

        document.querySelectorAll('.btn-predictive[data-mem]').forEach(b => {
            b.addEventListener('click', () => {
                const action = b.dataset.mem;
                const val = parseFloat(currentInput);
                if (action === 'mc') memoryValue = 0;
                if (action === 'mr') { currentInput = memoryValue.toString(); updateDisplay(); }
                if (action === 'm+') memoryValue += val;
                if (action === 'm-') memoryValue -= val;
            });
        });

        document.getElementById('toggle-scientific').addEventListener('click', () => {
            isScientificOpen = !isScientificOpen;
            scientificPanel.classList.toggle('hidden', !isScientificOpen);
        });

        document.getElementById('toggle-history').addEventListener('click', () => {
            historyDrawer.classList.remove('-translate-y-full');
            renderHistory();
        });
        document.getElementById('close-history').addEventListener('click', () => historyDrawer.classList.add('-translate-y-full'));
        document.getElementById('clear-history').addEventListener('click', () => {
            history = [];
            localStorage.removeItem('calc_history');
            renderHistory();
        });

        document.getElementById('toggle-theme').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            document.documentElement.classList.toggle('light');
        });
    </script>
</body>
</html>

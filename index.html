<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Cyber Pro Max Calculator</title>
    <meta name="theme-color" content="#050811">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#050811',
                            blue: '#00f2ff',
                            neonPink: '#ff007f',
                            purple: '#7928ca'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #050811;
        }

        .glass-hud {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(5, 8, 17, 0.95));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 255, 0.15);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        .light .glass-hud {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        @keyframes borderBeam {
            0% { border-color: rgba(0, 242, 255, 0.3); }
            50% { border-color: rgba(255, 0, 127, 0.6); }
            100% { border-color: rgba(0, 242, 255, 0.3); }
        }

        .hud-border {
            animation: borderBeam 4s infinite ease-in-out;
        }

        .btn-cyber {
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease, background 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
        }

        .btn-cyber:active, .btn-cyber.btn-pressed {
            transform: scale(0.88) translateY(3px);
        }

        .btn-num:active, .btn-num.btn-pressed {
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.7), inset 0 0 10px rgba(0, 242, 255, 0.4);
            border-color: #00f2ff;
            background: rgba(0, 242, 255, 0.15) !important;
        }

        .btn-action:active, .btn-action.btn-pressed {
            box-shadow: 0 0 30px rgba(121, 40, 202, 0.8), inset 0 0 12px rgba(121, 40, 202, 0.5);
            border-color: #7928ca;
            background: rgba(121, 40, 202, 0.25) !important;
            color: #fff !important;
        }

        .btn-danger:active, .btn-danger.btn-pressed {
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.8), inset 0 0 12px rgba(255, 0, 127, 0.5);
            border-color: #ff007f;
            background: rgba(255, 0, 127, 0.25) !important;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: plasmaRipple 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            background: radial-gradient(circle, rgba(0,242,255,0.8) 0%, rgba(255,0,127,0.4) 40%, transparent 70%);
            pointer-events: none;
        }

        @keyframes plasmaRipple {
            to { transform: scale(4); opacity: 0; }
        }

        #particle-canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 242, 255, 0.3); border-radius: 8px; }

        .result-animate {
            animation: springUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes springUp {
            0% { transform: translateY(8px) scale(0.95); opacity: 0.5; filter: blur(4px); }
            100% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
        }
    </style>
</head>
<body class="flex justify-center items-center relative overflow-hidden">

    <canvas id="particle-canvas"></canvas>

    <div class="relative w-full h-full glass-hud hud-border flex flex-col justify-between p-3 overflow-hidden text-white light:text-gray-900 transition-colors duration-300 z-20">
        
        <!-- Top Controls Bar -->
        <div class="flex justify-between items-center z-20 px-1 pt-1">
            <button id="toggle-history" class="p-2 rounded-xl bg-white/5 hover:bg-white/15 active:scale-95 transition text-cyber-blue border border-cyber-blue/20">
                <i data-lucide="clock" class="w-4 h-4"></i>
            </button>

            <div class="flex items-center gap-1.5">
                <button id="toggle-scientific" class="px-3 py-1 rounded-xl bg-white/5 hover:bg-white/15 text-xs font-semibold text-cyber-blue border border-cyber-blue/30 active:scale-95 transition shadow-[0_0_10px_rgba(0,242,255,0.2)]">
                    SCI
                </button>
                <button id="toggle-theme" class="p-2 rounded-xl bg-white/5 hover:bg-white/15 active:scale-95 transition text-cyber-blue border border-cyber-blue/20">
                    <i data-lucide="sun" class="w-4 h-4 hidden light:block"></i>
                    <i data-lucide="moon" class="w-4 h-4 block light:hidden"></i>
                </button>
            </div>
        </div>

        <!-- History Drawer -->
        <div id="history-drawer" class="absolute inset-x-0 top-0 h-[65%] glass-hud rounded-b-3xl z-40 transform -translate-y-full transition-transform duration-300 ease-in-out p-4 flex flex-col justify-between shadow-2xl border-b border-cyber-blue/30">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <span class="font-bold text-xs text-cyber-blue flex items-center gap-1.5">
                    <i data-lucide="history" class="w-3.5 h-3.5"></i> سجل الحسابات الكمومي
                </span>
                <button id="clear-history" class="text-xs text-cyber-pink hover:text-pink-300 flex items-center gap-1">
                    <i data-lucide="trash-2" class="w-3 h-3"></i> مسح
                </button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto my-2 space-y-2 text-left dir-ltr text-sm">
                <div class="text-center text-gray-500 py-8">لا يوجد سجل</div>
            </div>
            <button id="close-history" class="w-full py-2 rounded-xl bg-cyber-blue/20 text-cyber-blue text-xs font-semibold border border-cyber-blue/30">إغلاق</button>
        </div>

        <!-- Display Area -->
        <div class="flex flex-col justify-end text-left px-2 py-2 dir-ltr overflow-hidden relative cursor-pointer" id="display-container">
            <div id="expression" class="text-cyber-blue/70 text-xs font-mono h-5 overflow-x-auto whitespace-nowrap scrollbar-none"></div>
            <div id="display" class="text-4xl font-light tracking-tight text-white light:text-gray-900 truncate font-mono drop-shadow-[0_0_15px_rgba(0,242,255,0.4)]">
                0
            </div>
        </div>

        <!-- Scientific Panel -->
        <div id="scientific-panel" class="grid grid-cols-5 gap-1.5 mb-1 hidden dir-ltr">
            <button class="btn-cyber btn-action py-2 text-[11px] text-cyber-blue" data-op="sin">sin</button>
            <button class="btn-cyber btn-action py-2 text-[11px] text-cyber-blue" data-op="cos">cos</button>
            <button class="btn-cyber btn-action py-2 text-[11px] text-cyber-blue" data-op="tan">tan</button>
            <button class="btn-cyber btn-action py-2 text-[11px] text-cyber-blue" data-op="log">log</button>
            <button class="btn-cyber btn-action py-2 text-[11px] text-cyber-blue" data-op="ln">ln</button>
            <button class="btn-cyber btn-num py-2 text-[11px] text-gray-300" data-op="sqrt">√</button>
            <button class="btn-cyber btn-num py-2 text-[11px] text-gray-300" data-op="pow">x²</button>
            <button class="btn-cyber btn-num py-2 text-[11px] text-gray-300" data-op="pi">π</button>
            <button class="btn-cyber btn-num py-2 text-[11px] text-gray-300" data-op="e">e</button>
            <button class="btn-cyber btn-num py-2 text-[11px] text-gray-300" data-op="fact">n!</button>
        </div>

        <!-- Memory Row -->
        <div class="grid grid-cols-4 gap-1.5 mb-2 dir-ltr">
            <button class="btn-cyber py-1.5 text-[11px] text-gray-400 btn-num" data-mem="mc">MC</button>
            <button class="btn-cyber py-1.5 text-[11px] text-gray-400 btn-num" data-mem="mr">MR</button>
            <button class="btn-cyber py-1.5 text-[11px] text-gray-400 btn-num" data-mem="m+">M+</button>
            <button class="btn-cyber py-1.5 text-[11px] text-gray-400 btn-num" data-mem="m-">M-</button>
        </div>

        <!-- Main Keypad Grid -->
        <div class="grid grid-cols-4 gap-2.5 dir-ltr pb-2">
            <!-- Row 1 -->
            <button class="btn-cyber btn-danger h-12 text-cyber-pink font-semibold text-lg" id="btn-clear">C</button>
            <button class="btn-cyber btn-action h-12 text-cyber-blue font-semibold text-lg" data-action="(">(</button>
            <button class="btn-cyber btn-action h-12 text-cyber-blue font-semibold text-lg" data-action=")">)</button>
            <button class="btn-cyber btn-action h-12 text-cyber-blue font-semibold text-xl" data-action="/">÷</button>

            <!-- Row 2 -->
            <button class="btn-cyber btn-num h-12 text-white light:text-gray-800 text-xl font-medium" data-num="7">7</button>
            <button class="btn-cyber btn-num h-12 text-white light:text-gray-800 text-xl font-medium" data-num="8">8</button>
            <button class="btn-cyber btn-num h-12 text-white light:text-gray-800 text-xl font-medium" data-num="9">9</button>
            <button class="btn-cyber btn-action h-12 text-cyber-blue font-semibold text-xl" data-action="*">×</button>

            <!-- Row 3 -->
            <button class="btn-cyber btn-num h-12 text-white light:text-gray-800 text-xl font-medium" data-num="4">4</button>
            <button class="btn-cyber btn-num h-12 text-white light:text-gray-800 text-xl font-medium" data-num="5">5</button>
            <button class="btn-cyber btn-num h-12 text-white light:text-gray-800 text-xl font-medium" data-num="6">6</button>
            <button class="btn-cyber btn-action h-12 text-cyber-blue font-semibold text-xl" data-action="-">-</button>

            <!-- Row 4 -->
            <button class="btn-cyber btn-num h-12 text-white light:text-gray-800 text-xl font-medium" data-num="1">1</button>
            <button class="btn-cyber btn-num h-12 text-white light:text-gray-800 text-xl font-medium" data-num="2">2</button>
            <button class="btn-cyber btn-num h-12 text-white light:text-gray-800 text-xl font-medium" data-num="3">3</button>
            <button class="btn-cyber btn-action h-12 text-cyber-blue font-semibold text-xl" data-action="+">+</button>

            <!-- Row 5 -->
            <button class="btn-cyber btn-num h-12 text-white light:text-gray-800 text-xl font-medium" data-num="0">0</button>
            <button class="btn-cyber btn-num h-12 text-white light:text-gray-800 text-xl font-medium" data-num=".">.</button>
            <button class="btn-cyber btn-danger h-12 text-gray-300 flex items-center justify-center" id="btn-backspace">
                <i data-lucide="delete" class="w-5 h-5"></i>
            </button>
            <button class="btn-cyber btn-equals btn-action h-12 bg-gradient-to-r from-cyber-blue to-cyber-purple text-white font-bold text-2xl shadow-[0_0_20px_rgba(0,242,255,0.4)]" id="btn-equals">=</button>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        lucide.createIcons();

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class QuantumParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 4;
                this.speedY = (Math.random() - 0.5) * 4;
                this.color = Math.random() > 0.5 ? '#00f2ff' : '#ff007f';
                this.life = 1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createParticleBurst(x, y) {
            for (let i = 0; i < 12; i++) {
                particles.push(new QuantumParticle(x, y));
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(index, 1);
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        let fullExpression = '';
        let currentInput = '0';
        let memoryValue = 0;
        let history = JSON.parse(localStorage.getItem('calc_history') || '[]');
        let isScientificOpen = false;

        const display = document.getElementById('display');
        const expression = document.getElementById('expression');
        const historyDrawer = document.getElementById('history-drawer');
        const historyList = document.getElementById('history-list');
        const scientificPanel = document.getElementById('scientific-panel');

        function triggerHaptic() {
            if ('vibrate' in navigator) navigator.vibrate(25);
        }

        document.querySelectorAll('.btn-cyber').forEach(button => {
            button.addEventListener('pointerdown', function (e) {
                triggerHaptic();
                const rect = button.getBoundingClientRect();
                createParticleBurst(e.clientX, e.clientY);

                const circle = document.createElement('span');
                const diameter = Math.max(button.clientWidth, button.clientHeight);
                const radius = diameter / 2;
                
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${e.clientX - rect.left - radius}px`;
                circle.style.top = `${e.clientY - rect.top - radius}px`;
                circle.classList.add('ripple');
                
                const existingRipple = button.getElementsByClassName('ripple')[0];
                if (existingRipple) existingRipple.remove();
                
                button.appendChild(circle);
            });
        });

        function updateDisplay() {
            display.innerText = currentInput;
            expression.innerText = fullExpression;
        }

        function handleInput(val) {
            if (currentInput === '0' && val !== '.' && !['+', '-', '*', '/', '×', '÷'].includes(val)) {
                currentInput = val;
            } else {
                currentInput += val;
            }
            updateDisplay();
        }

        function handleOperator(op) {
            currentInput += ` ${op} `;
            updateDisplay();
        }

        function calculate() {
            try {
                let expressionStr = currentInput
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/π/g, Math.PI)
                    .replace(/e/g, Math.E);

                let result = eval(expressionStr);
                result = Math.round(result * 1e8) / 1e8;

                saveHistory(currentInput, result);

                fullExpression = currentInput + ' =';
                currentInput = result.toString();

                display.classList.add('result-animate');
                setTimeout(() => display.classList.remove('result-animate'), 250);

                updateDisplay();
            } catch (err) {
                currentInput = 'Error';
                updateDisplay();
            }
        }

        function handleScientific(op) {
            let val = parseFloat(currentInput);
            let res = 0;
            switch(op) {
                case 'sin': res = Math.sin(val); break;
                case 'cos': res = Math.cos(val); break;
                case 'tan': res = Math.tan(val); break;
                case 'log': res = Math.log10(val); break;
                case 'ln': res = Math.log(val); break;
                case 'sqrt': res = Math.sqrt(val); break;
                case 'pow': res = Math.pow(val, 2); break;
                case 'pi': currentInput = Math.PI.toString(); updateDisplay(); return;
                case 'e': currentInput = Math.E.toString(); updateDisplay(); return;
            }
            currentInput = (Math.round(res * 1e8) / 1e8).toString();
            updateDisplay();
        }

        function handleBackspace() {
            if (currentInput.length > 1) {
                currentInput = currentInput.trim();
                currentInput = currentInput.slice(0, -1).trim();
                if (currentInput === '') currentInput = '0';
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function saveHistory(expr, res) {
            history.unshift({ expr, res });
            if (history.length > 20) history.pop();
            localStorage.setItem('calc_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = `<div class="text-center text-gray-500 py-8">لا يوجد سجل</div>`;
                return;
            }
            historyList.innerHTML = history.map(item => `
                <div class="p-2.5 bg-white/5 hover:bg-white/10 rounded-xl cursor-pointer transition border border-cyber-blue/10" onclick="useHistory('${item.res}')">
                    <div class="text-[11px] text-gray-400">${item.expr}</div>
                    <div class="text-sm font-bold text-cyber-blue font-mono">= ${item.res}</div>
                </div>
            `).join('');
        }

        window.useHistory = function(res) {
            currentInput = res.toString();
            updateDisplay();
            historyDrawer.classList.add('-translate-y-full');
        };

        // Events
        document.querySelectorAll('.btn-num[data-num]').forEach(b => b.addEventListener('click', () => handleInput(b.dataset.num)));
        document.querySelectorAll('.btn-action[data-action]').forEach(b => b.addEventListener('click', () => {
            let act = b.dataset.action;
            if(['+', '-', '*', '/', '(', ')'].includes(act)) {
                handleInput(` ${act} `);
            }
        }));
        
        document.querySelectorAll('.btn-cyber[data-op]').forEach(b => b.addEventListener('click', () => handleScientific(b.dataset.op)));

        document.getElementById('btn-equals').addEventListener('click', calculate);
        document.getElementById('btn-clear').addEventListener('click', () => {
            currentInput = '0';
            fullExpression = '';
            updateDisplay();
        });
        document.getElementById('btn-backspace').addEventListener('click', handleBackspace);

        document.querySelectorAll('.btn-cyber[data-mem]').forEach(b => {
            b.addEventListener('click', () => {
                const action = b.dataset.mem;
                const val = parseFloat(currentInput);
                if (action === 'mc') memoryValue = 0;
                if (action === 'mr') { currentInput = memoryValue.toString(); updateDisplay(); }
                if (action === 'm+') memoryValue += val;
                if (action === 'm-') memoryValue -= val;
            });
        });

        document.getElementById('toggle-scientific').addEventListener('click', () => {
            isScientificOpen = !isScientificOpen;
            scientificPanel.classList.toggle('hidden', !isScientificOpen);
        });

        document.getElementById('toggle-history').addEventListener('click', () => {
            historyDrawer.classList.remove('-translate-y-full');
            renderHistory();
        });
        document.getElementById('close-history').addEventListener('click', () => historyDrawer.classList.add('-translate-y-full'));
        document.getElementById('clear-history').addEventListener('click', () => {
            history = [];
            localStorage.removeItem('calc_history');
            renderHistory();
        });

        document.getElementById('toggle-theme').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            document.documentElement.classList.toggle('light');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            background-color: #121212;
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }

        .display {
            color: #ffffff;
            font-size: 4rem;
            text-align: left;
            padding: 20px 10px;
            word-wrap: break-word;
            word-break: break-all;
            min-height: 120px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button {
            background-color: #1e1e1e;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            font-size: 1.8rem;
            height: 70px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:active {
            background-color: #333333;
        }

        /* ألوان الأزرار الخاصة */
        .c-btn {
            color: #ff5252;
        }

        .operator {
            color: #4dabf7;
        }

        .equals {
            background-color: #228be6;
            color: #ffffff;
            border-radius: 25px;
        }

        .equals:active {
            background-color: #1c7ed6;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="c-btn" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendCharacter('%')">%</button>
            <button class="operator" onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="appendCharacter('/')">÷</button>

            <button onclick="appendCharacter('7')">7</button>
            <button onclick="appendCharacter('8')">8</button>
            <button onclick="appendCharacter('9')">9</button>
            <button class="operator" onclick="appendCharacter('*')">×</button>

            <button onclick="appendCharacter('4')">4</button>
            <button onclick="appendCharacter('5')">5</button>
            <button onclick="appendCharacter('6')">6</button>
            <button class="operator" onclick="appendCharacter('-')">-</button>

            <button onclick="appendCharacter('1')">1</button>
            <button onclick="appendCharacter('2')">2</button>
            <button onclick="appendCharacter('3')">3</button>
            <button class="operator" onclick="appendCharacter('+')">+</button>

            <button onclick="appendCharacter('0')">0</button>
            <button onclick="appendCharacter('.')">.</button>
            <button class="equals" onclick="calculateResult()" style="grid-column: span 2;">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendCharacter(char) {
            if (display.innerText === '0' && char !== '.') {
                display.innerText = char;
            } else {
                display.innerText += char;
            }
        }

        function clearDisplay() {
            display.innerText = '0';
        }

        function deleteLast() {
            if (display.innerText.length > 1) {
                display.innerText = display.innerText.slice(0, -1);
            } else {
                display.innerText = '0';
            }
        }

        function calculateResult() {
            try {
                // استبدال الرموز لتعمل بشكل صحيح في البرمجة
                let expression = display.innerText
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/');
                
                let result = eval(expression);
                display.innerText = result;
            } catch (error) {
                display.innerText = 'خطأ';
            }
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Max Calculator</title>
    <!-- PWA Settings -->
    <meta name="theme-color" content="#090d16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#00d2ff',
                            gradientStart: '#0052D4',
                            gradientMid: '#4364F7',
                            gradientEnd: '#6FB1FC',
                            darkBg: '#080b12',
                            cardBg: '#131b2e'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Glassmorphism Effect */
        .glass-panel {
            background: rgba(15, 22, 38, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .light .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        /* PRO MAX Glow & Motion Effects */
        .btn-pro {
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.04);
        }

        /* 3D Dynamic Press Movement */
        .btn-pro:active, .btn-pro.btn-pressed {
            transform: scale(0.92) translateY(3px);
        }

        /* Dynamic Glow Effects when clicked */
        .btn-num:active, .btn-num.btn-pressed {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.2) !important;
        }

        .btn-action:active, .btn-action.btn-pressed {
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.8), inset 0 0 12px rgba(0, 210, 255, 0.5);
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.25) !important;
            color: #ffffff !important;
        }

        .btn-danger:active, .btn-danger.btn-pressed {
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.8), inset 0 0 12px rgba(239, 68, 68, 0.5);
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.3) !important;
        }

        .btn-equals:active, .btn-equals.btn-pressed {
            box-shadow: 0 0 35px rgba(67, 100, 247, 0.9), 0 0 15px rgba(0, 210, 255, 0.6);
            transform: scale(0.94) translateY(2px);
        }

        /* Light Ripple wave */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-glow 0.45s ease-out;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
        }

        @keyframes ripple-glow {
            to {
                transform: scale(3.5);
                opacity: 0;
            }
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        /* Animated Result Spring */
        .result-animate {
            animation: springUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes springUp {
            0% { transform: translateY(8px) scale(0.96); opacity: 0.6; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-brand-darkBg light:bg-gray-100 text-white light:text-gray-900 h-screen w-screen flex justify-center items-center overflow-hidden transition-colors duration-300">

    <!-- App Container -->
    <div class="relative w-full max-w-md h-full sm:h-[92vh] sm:rounded-[42px] glass-panel shadow-2xl flex flex-col justify-between p-5 overflow-hidden border-0 sm:border border-white/10">
        
        <!-- Top Controls Bar -->
        <div class="flex justify-between items-center z-20 pt-2 pb-1 px-1">
            <button id="toggle-history" class="p-2.5 rounded-2xl bg-white/5 hover:bg-white/10 active:scale-95 transition text-gray-300 light:text-gray-700">
                <i data-lucide="clock" class="w-5 h-5"></i>
            </button>

            <div class="flex items-center gap-2">
                <button id="toggle-scientific" class="px-3.5 py-1.5 rounded-2xl bg-white/5 hover:bg-white/10 text-xs font-semibold text-brand-blue border border-brand-blue/30 active:scale-95 transition">
                    SCI
                </button>
                <button id="toggle-theme" class="p-2.5 rounded-2xl bg-white/5 hover:bg-white/10 active:scale-95 transition text-gray-300 light:text-gray-700">
                    <i data-lucide="sun" class="w-5 h-5 hidden light:block"></i>
                    <i data-lucide="moon" class="w-5 h-5 block light:hidden"></i>
                </button>
            </div>
        </div>

        <!-- History Drawer -->
        <div id="history-drawer" class="absolute inset-x-0 top-0 h-[65%] glass-panel rounded-b-[38px] z-30 transform -translate-y-full transition-transform duration-300 ease-in-out p-5 flex flex-col justify-between shadow-2xl">
            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                <span class="font-bold text-sm tracking-wide text-brand-blue flex items-center gap-2">
                    <i data-lucide="history" class="w-4 h-4"></i> سجل الحسابات
                </span>
                <button id="clear-history" class="text-xs text-red-400 hover:text-red-300 flex items-center gap-1">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> مسح
                </button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto my-3 space-y-3 text-left dir-ltr">
                <div class="text-center text-gray-500 text-sm py-10">لا يوجد سجل حتى الآن</div>
            </div>
            <button id="close-history" class="w-full py-2.5 rounded-2xl bg-white/10 hover:bg-white/15 text-xs font-semibold">إغلاق</button>
        </div>

        <!-- Display Area -->
        <div class="flex-1 flex flex-col justify-end text-left px-2 py-4 dir-ltr overflow-hidden relative cursor-pointer" id="display-container">
            <div id="expression" class="text-gray-400 light:text-gray-500 text-sm sm:text-base font-mono h-6 overflow-x-auto whitespace-nowrap scrollbar-none transition-all"></div>
            <div id="display" class="text-4xl sm:text-5xl font-light tracking-tight text-white light:text-gray-900 truncate my-1 font-mono transition-all duration-200">
                0
            </div>
        </div>

        <!-- Scientific Panel -->
        <div id="scientific-panel" class="grid grid-cols-5 gap-2 mb-2 hidden transition-all duration-300 dir-ltr">
            <button class="btn-pro btn-action py-2.5 text-xs font-medium text-brand-blue" data-op="sin">sin</button>
            <button class="btn-pro btn-action py-2.5 text-xs font-medium text-brand-blue" data-op="cos">cos</button>
            <button class="btn-pro btn-action py-2.5 text-xs font-medium text-brand-blue" data-op="tan">tan</button>
            <button class="btn-pro btn-action py-2.5 text-xs font-medium text-brand-blue" data-op="log">log</button>
            <button class="btn-pro btn-action py-2.5 text-xs font-medium text-brand-blue" data-op="ln">ln</button>
            <button class="btn-pro btn-num py-2.5 text-xs font-medium text-gray-300" data-op="sqrt">√</button>
            <button class="btn-pro btn-num py-2.5 text-xs font-medium text-gray-300" data-op="pow">x²</button>
            <button class="btn-pro btn-num py-2.5 text-xs font-medium text-gray-300" data-op="pi">π</button>
            <button class="btn-pro btn-num py-2.5 text-xs font-medium text-gray-300" data-op="e">e</button>
            <button class="btn-pro btn-num py-2.5 text-xs font-medium text-gray-300" data-op="fact">n!</button>
        </div>

        <!-- Memory Row -->
        <div class="grid grid-cols-4 gap-2 mb-3 dir-ltr">
            <button class="btn-pro py-1.5 text-[11px] text-gray-400 hover:text-white btn-num" data-mem="mc">MC</button>
            <button class="btn-pro py-1.5 text-[11px] text-gray-400 hover:text-white btn-num" data-mem="mr">MR</button>
            <button class="btn-pro py-1.5 text-[11px] text-gray-400 hover:text-white btn-num" data-mem="m+">M+</button>
            <button class="btn-pro py-1.5 text-[11px] text-gray-400 hover:text-white btn-num" data-mem="m-">M-</button>
        </div>

        <!-- Main Keypad Grid -->
        <div class="grid grid-cols-4 gap-3 dir-ltr">
            <!-- Row 1 -->
            <button class="btn-pro btn-danger h-14 text-red-400 font-semibold text-lg" id="btn-clear">C</button>
            <button class="btn-pro btn-action h-14 text-brand-blue font-semibold text-lg" data-action="(">(</button>
            <button class="btn-pro btn-action h-14 text-brand-blue font-semibold text-lg" data-action=")">)</button>
            <button class="btn-pro btn-action h-14 text-brand-blue font-semibold text-xl" data-action="/">÷</button>

            <!-- Row 2 -->
            <button class="btn-pro btn-num h-14 text-white light:text-gray-800 text-xl font-medium" data-num="7">7</button>
            <button class="btn-pro btn-num h-14 text-white light:text-gray-800 text-xl font-medium" data-num="8">8</button>
            <button class="btn-pro btn-num h-14 text-white light:text-gray-800 text-xl font-medium" data-num="9">9</button>
            <button class="btn-pro btn-action h-14 text-brand-blue font-semibold text-xl" data-action="*">×</button>

            <!-- Row 3 -->
            <button class="btn-pro btn-num h-14 text-white light:text-gray-800 text-xl font-medium" data-num="4">4</button>
            <button class="btn-pro btn-num h-14 text-white light:text-gray-800 text-xl font-medium" data-num="5">5</button>
            <button class="btn-pro btn-num h-14 text-white light:text-gray-800 text-xl font-medium" data-num="6">6</button>
            <button class="btn-pro btn-action h-14 text-brand-blue font-semibold text-xl" data-action="-">-</button>

            <!-- Row 4 -->
            <button class="btn-pro btn-num h-14 text-white light:text-gray-800 text-xl font-medium" data-num="1">1</button>
            <button class="btn-pro btn-num h-14 text-white light:text-gray-800 text-xl font-medium" data-num="2">2</button>
            <button class="btn-pro btn-num h-14 text-white light:text-gray-800 text-xl font-medium" data-num="3">3</button>
            <button class="btn-pro btn-action h-14 text-brand-blue font-semibold text-xl" data-action="+">+</button>

            <!-- Row 5 -->
            <button class="btn-pro btn-num h-14 text-white light:text-gray-800 text-xl font-medium" data-num="0">0</button>
            <button class="btn-pro btn-num h-14 text-white light:text-gray-800 text-xl font-medium" data-num=".">.</button>
            <button class="btn-pro btn-danger h-14 text-gray-300 text-lg flex items-center justify-center" id="btn-backspace">
                <i data-lucide="delete" class="w-5 h-5"></i>
            </button>
            <button class="btn-pro btn-equals h-14 bg-gradient-to-r from-brand-gradientStart via-brand-gradientMid to-brand-gradientEnd text-white font-bold text-2xl" id="btn-equals">=</button>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        lucide.createIcons();

        let currentInput = '0';
        let expressionVal = '';
        let memoryValue = 0;
        let history = JSON.parse(localStorage.getItem('calc_history') || '[]');
        let isScientificOpen = false;

        const display = document.getElementById('display');
        const expression = document.getElementById('expression');
        const historyDrawer = document.getElementById('history-drawer');
        const historyList = document.getElementById('history-list');
        const scientificPanel = document.getElementById('scientific-panel');

        function triggerHaptic() {
            if ('vibrate' in navigator) navigator.vibrate(20);
        }

        // Add Light Glow & Ripple on Click
        document.querySelectorAll('.btn-pro').forEach(button => {
            button.addEventListener('pointerdown', function (e) {
                triggerHaptic();
                
                // Add Ripple Effect
                const circle = document.createElement('span');
                const diameter = Math.max(button.clientWidth, button.clientHeight);
                const radius = diameter / 2;
                const rect = button.getBoundingClientRect();
                
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${e.clientX - rect.left - radius}px`;
                circle.style.top = `${e.clientY - rect.top - radius}px`;
                circle.classList.add('ripple');
                
                const existingRipple = button.getElementsByClassName('ripple')[0];
                if (existingRipple) existingRipple.remove();
                
                button.appendChild(circle);
            });
        });

        function formatNumber(numStr) {
            if (numStr === 'Error' || numStr === 'Infinity') return numStr;
            const num = parseFloat(numStr);
            if (isNaN(num)) return numStr;
            return new Intl.NumberFormat('en-US', { maximumFractionDigits: 8 }).format(num);
        }

        function updateDisplay() {
            display.innerText = formatNumber(currentInput);
            expression.innerText = expressionVal;
            
            const len = display.innerText.length;
            if (len > 12) display.style.fontSize = '1.8rem';
            else if (len > 8) display.style.fontSize = '2.5rem';
            else display.style.fontSize = '3rem';
        }

        function handleNumber(num) {
            if (currentInput === '0' && num !== '.') currentInput = num;
            else if (num === '.' && currentInput.includes('.')) return;
            else currentInput += num;
            updateDisplay();
        }

        function handleOperator(op) {
            expressionVal += ` ${currentInput} ${op}`;
            currentInput = '0';
            updateDisplay();
        }

        function calculate() {
            try {
                let fullExpression = expressionVal + ' ' + currentInput;
                let sanitizedExpr = fullExpression
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/π/g, Math.PI)
                    .replace(/e/g, Math.E);

                let result = eval(sanitizedExpr);
                result = Math.round(result * 1e8) / 1e8;

                saveHistory(fullExpression, result);

                display.classList.add('result-animate');
                setTimeout(() => display.classList.remove('result-animate'), 300);

                currentInput = result.toString();
                expressionVal = '';
                updateDisplay();
            } catch (err) {
                currentInput = 'Error';
                updateDisplay();
            }
        }

        function handleScientific(op) {
            let val = parseFloat(currentInput);
            let res = 0;
            switch(op) {
                case 'sin': res = Math.sin(val); break;
                case 'cos': res = Math.cos(val); break;
                case 'tan': res = Math.tan(val); break;
                case 'log': res = Math.log10(val); break;
                case 'ln': res = Math.log(val); break;
                case 'sqrt': res = Math.sqrt(val); break;
                case 'pow': res = Math.pow(val, 2); break;
                case 'pi': currentInput = Math.PI.toString(); updateDisplay(); return;
                case 'e': currentInput = Math.E.toString(); updateDisplay(); return;
            }
            currentInput = (Math.round(res * 1e8) / 1e8).toString();
            updateDisplay();
        }

        function handleBackspace() {
            currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : '0';
            updateDisplay();
        }

        function saveHistory(expr, res) {
            history.unshift({ expr, res });
            if (history.length > 20) history.pop();
            localStorage.setItem('calc_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = `<div class="text-center text-gray-500 text-sm py-10">لا يوجد سجل حتى الآن</div>`;
                return;
            }
            historyList.innerHTML = history.map(item => `
                <div class="p-3 bg-white/5 hover:bg-white/10 rounded-2xl cursor-pointer transition" onclick="useHistory('${item.res}')">
                    <div class="text-xs text-gray-400">${item.expr}</div>
                    <div class="text-lg font-bold text-brand-blue font-mono">= ${item.res}</div>
                </div>
            `).join('');
        }

        window.useHistory = function(res) {
            currentInput = res.toString();
            updateDisplay();
            historyDrawer.classList.add('-translate-y-full');
        };

        // Click Bindings
        document.querySelectorAll('.btn-num[data-num]').forEach(b => b.addEventListener('click', () => handleNumber(b.dataset.num)));
        document.querySelectorAll('.btn-action[data-action]').forEach(b => b.addEventListener('click', () => handleOperator(b.dataset.action)));
        document.querySelectorAll('.btn-pro[data-op]').forEach(b => b.addEventListener('click', () => handleScientific(b.dataset.op)));

        document.getElementById('btn-equals').addEventListener('click', calculate);
        document.getElementById('btn-clear').addEventListener('click', () => {
            currentInput = '0';
            expressionVal = '';
            updateDisplay();
        });
        document.getElementById('btn-backspace').addEventListener('click', handleBackspace);

        document.querySelectorAll('.btn-pro[data-mem]').forEach(b => {
            b.addEventListener('click', () => {
                const action = b.dataset.mem;
                const val = parseFloat(currentInput);
                if (action === 'mc') memoryValue = 0;
                if (action === 'mr') { currentInput = memoryValue.toString(); updateDisplay(); }
                if (action === 'm+') memoryValue += val;
                if (action === 'm-') memoryValue -= val;
            });
        });

        document.getElementById('toggle-scientific').addEventListener('click', () => {
            isScientificOpen = !isScientificOpen;
            scientificPanel.classList.toggle('hidden', !isScientificOpen);
        });

        document.getElementById('toggle-history').addEventListener('click', () => {
            historyDrawer.classList.remove('-translate-y-full');
            renderHistory();
        });
        document.getElementById('close-history').addEventListener('click', () => historyDrawer.classList.add('-translate-y-full'));
        document.getElementById('clear-history').addEventListener('click', () => {
            history = [];
            localStorage.removeItem('calc_history');
            renderHistory();
        });

        document.getElementById('toggle-theme').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            document.documentElement.classList.toggle('light');
        });

        // Keyboard Support with Glow Effect Trigger
        window.addEventListener('keydown', e => {
            let selector = '';
            if (e.key >= '0' && e.key <= '9') { handleNumber(e.key); selector = `[data-num="${e.key}"]`; }
            if (e.key === '.') { handleNumber('.'); selector = `[data-num="."]`; }
            if (['+', '-', '*', '/'].includes(e.key)) { handleOperator(e.key); selector = `[data-action="${e.key}"]`; }
            if (e.key === 'Enter' || e.key === '=') { calculate(); selector = `#btn-equals`; }
            if (e.key === 'Backspace') { handleBackspace(); selector = `#btn-backspace`; }
            if (e.key === 'Escape') { currentInput = '0'; expressionVal = ''; updateDisplay(); selector = `#btn-clear`; }

            if (selector) {
                const btn = document.querySelector(selector);
                if (btn) {
                    btn.classList.add('btn-pressed');
                    setTimeout(() => btn.classList.remove('btn-pressed'), 200);
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المحادثة بالذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col justify-between">
    <header class="bg-gray-800 p-4 text-center font-bold text-lg border-b border-gray-700">
        مساعد الذكاء الاصطناعي
    </header>

    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="flex justify-start">
            <div class="bg-gray-700 p-3 rounded-lg max-w-[80%]">أهلاً بك! كيف يمكنني مساعدتك اليوم؟</div>
        </div>
    </div>

    <div class="bg-gray-800 p-3 border-t border-gray-700 flex gap-2">
        <input type="text" id="user-input" placeholder="اكتب سؤالك هنا..." class="flex-1 bg-gray-700 text-white px-4 py-2 rounded-lg focus:outline-none">
        <button onclick="sendMessage()" class="bg-blue-600 px-5 py-2 rounded-lg font-bold hover:bg-blue-500">إرسال</button>
    </div>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        const ai = new GoogleGenAI({ apiKey: "AIzaSyAm4ueu_kGpxCPMKZwOY5-DoNgXUgvsoBs" });
        
        window.sendMessage = async function() {
            const inputField = document.getElementById("user-input");
            const chatContainer = document.getElementById("chat-container");
            const text = inputField.value.trim();
            
            if (!text) return;

            chatContainer.innerHTML += `<div class="flex justify-end"><div class="bg-blue-600 p-3 rounded-lg max-w-[80%]">${text}</div></div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await ai.models.generateContent({
                    model: 'gemini-1.5-flash',
                    contents: text,
                });

                const reply = response.text;

                chatContainer.innerHTML += `<div class="flex justify-start"><div class="bg-gray-700 p-3 rounded-lg max-w-[80%]">${reply}</div></div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (error) {
                console.error(error);
                chatContainer.innerHTML += `<div class="flex justify-start"><div class="bg-red-600 p-3 rounded-lg max-w-[80%]">عذراً، حدث خطأ في الاتصال.</div></div>`;
            }
        }
    </script>
</body>
</html>
